workflows:
  ios-release:
    name: iOS App Store Release
    instance_type: mac_mini_m2
    max_build_duration: 60

    environment:
      flutter: stable
      xcode: latest
      cocoapods: default

      vars:
        BUNDLE_ID: "com.futurafund.scanpdf"
        APP_STORE_APP_ID: "6792221523"

      groups:
        - Env

    triggering:
      events:
        - tag
      tag_patterns:
        - pattern: 'v*'
          include: true

    scripts:
      - name: Get Flutter packages
        script: |
          flutter pub get

      - name: Install pods
        script: |
          find . -name "Podfile" -execdir pod install \;

      - name: Set up code signing
        script: |
          keychain initialize

          if [ -z "$CERTIFICATE_PRIVATE_KEY" ]; then
            echo "=================================================="
            echo "CERTIFICATE_PRIVATE_KEY not found!"
            echo "=================================================="
            echo ""
            echo "Generating a new private key for first build..."
            echo ""
            openssl genrsa -out ~/ios_distribution_private_key.pem 2048
            export CERTIFICATE_PRIVATE_KEY=$(cat ~/ios_distribution_private_key.pem)
            echo "Generated new private key"
            echo ""
            echo "IMPORTANT: Add this key to CERTIFICATE_PRIVATE_KEY in your Codemagic Env group:"
            echo "=================================================="
            cat ~/ios_distribution_private_key.pem
            echo "=================================================="
            echo ""
            echo "Using generated key for this build..."
            app-store-connect fetch-signing-files \
              "$BUNDLE_ID" \
              --type IOS_APP_STORE \
              --create \
              --certificate-key=@file:$HOME/ios_distribution_private_key.pem
          else
            echo "Using CERTIFICATE_PRIVATE_KEY from environment"
            app-store-connect fetch-signing-files \
              "$BUNDLE_ID" \
              --type IOS_APP_STORE \
              --create \
              --certificate-key=@env:CERTIFICATE_PRIVATE_KEY
          fi

          keychain add-certificates
          xcode-project use-profiles

      - name: Set build number
        script: |
          BUILD_NUMBER=$(($(app-store-connect get-latest-build-number "$APP_STORE_APP_ID") + 1))
          echo "BUILD_NUMBER=$BUILD_NUMBER" >> $CM_ENV

      - name: Build iOS app
        script: |
          flutter build ipa \
            --release \
            --no-tree-shake-icons \
            --build-number=$BUILD_NUMBER \
            --export-options-plist=$HOME/export_options.plist

      - name: Deploy to App Store Connect
        script: |
          app-store-connect publish \
            --path "$CM_BUILD_DIR/build/ios/ipa/*.ipa" \
            --testflight

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - flutter_drive.log

    publishing:
      email:
        recipients:
          - dev@nobrainerlab.io
        notify:
          success: true
          failure: true
